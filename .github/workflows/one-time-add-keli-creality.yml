name: One-time add KELI Creality steppers

on:
  push:
    branches:
      - add-creality-keli-bj42d15

permissions:
  contents: write

jobs:
  curate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add KELI Creality BJ42D15 variants
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const path = 'motors.js';
          const raw = fs.readFileSync(path, 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(raw, sandbox, { filename: path });

          let steppers = Array.isArray(sandbox.window.AK3D_MOTORS) ? sandbox.window.AK3D_MOTORS : [];
          const defaults = Array.isArray(sandbox.window.AK3D_DEFAULTS) ? sandbox.window.AK3D_DEFAULTS : [];

          const source = 'https://drive.google.com/file/d/10bUmRyaTjHy4UPEDfP2xxpU4MgqT2sci/view?usp=sharing';
          const shared = {
            brand: 'KELI/Creality',
            nema: 17,
            bodyLength: 34,
            stepAngle: 1.8,
            ratedCurrent: 0.84,
            holdingTorque: 28,
            inductance: 8.8,
            resistance: 6,
            rotorInertia: 38,
            source,
            note: 'Creality 42-34 axis stepper. KELI performance code 26; V09/V10/V12 are mechanical variants. Electrical values follow the KELI BJ42D15-26V10 drawing.'
          };

          const variants = ['V09', 'V10', 'V12'];
          for (const suffix of variants) {
            const model = `BJ42D15-26${suffix}`;
            const stepper = {
              key: `KELI-Creality-${model}`,
              ...shared,
              model
            };
            const i = steppers.findIndex(s => s.key === stepper.key || (s.brand === stepper.brand && s.model === stepper.model));
            if (i >= 0) steppers[i] = { ...steppers[i], ...stepper };
            else steppers.push(stepper);
          }

          const nemaRank = value => {
            const n = Number(value);
            if (n === 17) return 0;
            if (n === 14) return 1;
            if (n === 23) return 2;
            return 10 + (Number.isFinite(n) ? n : 99);
          };
          const lengthValue = s => {
            const n = Number(s.bodyLength);
            return Number.isFinite(n) && n > 0 ? n : Infinity;
          };

          steppers.sort((a, b) =>
            nemaRank(a.nema) - nemaRank(b.nema) ||
            String(a.brand || '').localeCompare(String(b.brand || ''), undefined, { sensitivity: 'base' }) ||
            lengthValue(a) - lengthValue(b) ||
            String(a.model || a.key).localeCompare(String(b.model || b.key), undefined, { numeric: true, sensitivity: 'base' })
          );

          const preferredFields = [
            'key', 'brand', 'model', 'nema', 'bodyLength', 'stepAngle', 'ratedCurrent',
            'holdingTorque', 'inductance', 'resistance', 'rotorInertia', 'source', 'note'
          ];
          const jsValue = value => JSON.stringify(value).replace(/\u00a0/gi, '\\u00A0');
          const lines = [
            '// AK3D Motion Lab · Stepper database',
            '//',
            '// Ordered for humans exactly like the UI: NEMA → brand → body length → model.',
            '// Keep `key` unique and stable because saved browser selections reference it.',
            '// Units: bodyLength mm · ratedCurrent A · holdingTorque N·cm · inductance mH',
            '//        resistance Ω · rotorInertia g·cm² · stepAngle °',
            '',
            'window.AK3D_MOTORS = ['
          ];

          let lastGroup = '';
          for (const stepper of steppers) {
            const nema = Number.isFinite(Number(stepper.nema)) ? Number(stepper.nema) : 'Other';
            const group = `NEMA ${nema} · ${stepper.brand || 'Other'}`;
            if (group !== lastGroup) {
              if (lastGroup) lines.push('');
              lines.push(`  // ── ${group} ──`);
              lastGroup = group;
            }
            lines.push('  {');
            const keys = [
              ...preferredFields.filter(k => Object.prototype.hasOwnProperty.call(stepper, k)),
              ...Object.keys(stepper).filter(k => !preferredFields.includes(k)).sort()
            ];
            keys.forEach((key, index) => {
              const comma = index === keys.length - 1 ? '' : ',';
              lines.push(`    ${key}: ${jsValue(stepper[key])}${comma}`);
            });
            lines.push('  },');
          }
          lines.push('];', '', '// Default steppers shown when the browser has no saved selection yet.', 'window.AK3D_DEFAULTS = [');
          defaults.forEach(k => lines.push(`  ${JSON.stringify(k)},`));
          lines.push('];', '');
          fs.writeFileSync(path, lines.join('\n'));

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace(/- \d+ curated stepper entries in the public database/, `- ${steppers.length} curated stepper entries in the public database`);
          fs.writeFileSync(readmePath, readme);

          console.log(`Database now contains ${steppers.length} curated steppers.`);
          NODE

      - name: Commit curated data
        shell: bash
        run: |
          if git diff --quiet -- motors.js README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motors.js README.md
          git commit -m "Add KELI Creality 42-34 stepper variants"
          git push

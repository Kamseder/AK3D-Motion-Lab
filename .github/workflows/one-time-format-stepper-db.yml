name: One-time format stepper database

on:
  push:
    branches:
      - clean-stepper-database-and-dropdown

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format and normalize motors.js
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const path = 'motors.js';
          const raw = fs.readFileSync(path, 'utf8').trim();
          const motorsMatch = raw.match(/window\.AK3D_MOTORS\s*=\s*(\[[\s\S]*?\]);/);
          const defaultsMatch = raw.match(/window\.AK3D_DEFAULTS\s*=\s*(\[[\s\S]*?\]);?/);
          if (!motorsMatch) throw new Error('Could not parse AK3D_MOTORS in motors.js');

          let steppers = JSON.parse(motorsMatch[1]);
          const defaults = defaultsMatch ? JSON.parse(defaultsMatch[1]) : [];

          // Make motors.js the single source of truth instead of fixing data later in preload.js.
          steppers = steppers.filter(stepper => String(stepper.brand || '').trim() !== 'Noname');
          steppers.forEach(stepper => {
            const brand = String(stepper.brand || 'Other').trim() || 'Other';
            stepper.brand = (brand === 'OMC' || brand === 'StepperOnline') ? 'OMC/StepperOnline' : brand;
            if (typeof stepper.model === 'string') stepper.model = stepper.model.trim();
          });

          const excit3d = {
            key: 'Excit3D-MaxMotor',
            brand: 'Excit3D',
            model: 'MaxMotor',
            nema: 17,
            bodyLength: 48,
            stepAngle: 1.8,
            ratedCurrent: 4,
            holdingTorque: 56,
            inductance: 0.6,
            resistance: 0.45,
            rotorInertia: 82,
            source: 'https://excit3d.shop/shop/excit3d-max-motor',
            note: '55 mm shaft, Class H 180 C.'
          };
          if (!steppers.some(stepper => stepper.key === excit3d.key)) steppers.push(excit3d);

          const seen = new Set();
          for (const stepper of steppers) {
            if (!stepper.key) throw new Error('Stepper without key');
            if (seen.has(stepper.key)) throw new Error(`Duplicate key: ${stepper.key}`);
            seen.add(stepper.key);
          }

          const nemaRank = value => {
            const n = Number(value);
            if (n === 17) return 0;
            if (n === 14) return 1;
            if (n === 23) return 2;
            return 10 + (Number.isFinite(n) ? n : 99);
          };
          const lengthValue = stepper => {
            const n = Number(stepper.bodyLength);
            return Number.isFinite(n) && n > 0 ? n : Infinity;
          };

          steppers.sort((a, b) =>
            nemaRank(a.nema) - nemaRank(b.nema) ||
            String(a.brand || '').localeCompare(String(b.brand || ''), undefined, {sensitivity: 'base'}) ||
            lengthValue(a) - lengthValue(b) ||
            String(a.model || a.key).localeCompare(String(b.model || b.key), undefined, {numeric: true, sensitivity: 'base'})
          );

          const preferredFields = [
            'key', 'brand', 'model', 'nema', 'bodyLength', 'stepAngle', 'ratedCurrent',
            'holdingTorque', 'inductance', 'resistance', 'rotorInertia', 'source', 'note'
          ];

          const jsValue = value => JSON.stringify(value).replace(/\u00a0/gi, '\\u00A0');
          const lines = [
            '// AK3D Motion Lab · Stepper database',
            '//',
            '// Ordered for humans exactly like the UI: NEMA → brand → body length → model.',
            '// Keep `key` unique and stable because saved browser selections reference it.',
            '// Units: bodyLength mm · ratedCurrent A · holdingTorque N·cm · inductance mH',
            '//        resistance Ω · rotorInertia g·cm² · stepAngle °',
            '',
            'window.AK3D_MOTORS = ['
          ];

          let lastGroup = '';
          for (const stepper of steppers) {
            const nema = Number.isFinite(Number(stepper.nema)) ? Number(stepper.nema) : 'Other';
            const group = `NEMA ${nema} · ${stepper.brand || 'Other'}`;
            if (group !== lastGroup) {
              if (lastGroup) lines.push('');
              lines.push(`  // ── ${group} ──`);
              lastGroup = group;
            }

            lines.push('  {');
            const keys = [...preferredFields.filter(key => Object.prototype.hasOwnProperty.call(stepper, key)),
              ...Object.keys(stepper).filter(key => !preferredFields.includes(key)).sort()];
            keys.forEach((key, index) => {
              const comma = index === keys.length - 1 ? '' : ',';
              lines.push(`    ${key}: ${jsValue(stepper[key])}${comma}`);
            });
            lines.push('  },');
          }
          lines.push('];', '');

          lines.push('// Default steppers shown when the browser has no saved selection yet.');
          lines.push('window.AK3D_DEFAULTS = [');
          defaults.forEach((key, index) => {
            const comma = index === defaults.length - 1 ? '' : ',';
            lines.push(`  ${jsValue(key)}${comma}`);
          });
          lines.push('];', '');

          fs.writeFileSync(path, lines.join('\n'));

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace(/- \d+ stepper entries imported from the current workbook/, `- ${steppers.length} curated stepper entries in the public database`);
          fs.writeFileSync(readmePath, readme);

          console.log(`Formatted ${steppers.length} steppers and ${defaults.length} defaults.`);
          NODE

      - name: Commit formatted database
        shell: bash
        run: |
          if git diff --quiet -- motors.js README.md; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motors.js README.md
          git commit -m "Format and normalize stepper database"
          git push
